<script data-dc-script data-props='{"$preview":{"width":393,"height":852}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { sel: { 1: true, 3: true, 4: true, 6: true } };
  }
  toggle(i) {
    const next = Object.assign({}, this.state.sel);
    next[i] = !next[i];
    this.setState({ sel: next });
  }
  renderVals() {
    const tones = ['#E3A32F', '#7E9B78', '#E8927A', '#EBCBA4'];
    const v = {};
    let count = 0;
    for (let i = 1; i <= 12; i++) {
      const tone = tones[(i - 1) % 4];
      const on = !!this.state.sel[i];
      if (on) { count++; }
      v['c' + i] = {
        on: on,
        bg: on ? tone : '#FFF9F0',
        ic: on ? '#FFF4E6' : tone,
        sh: on ? '3px 3px 0 #241A16' : 'none',
        pick: () => this.toggle(i)
      };
    }
    v.countLabel = count > 0 ? ' (' + count + ')' : '';
    v.ctaOpacity = count > 0 ? '1' : '0.4';
    v.ctaShadow = count > 0 ? '5px 5px 0 #B5462A' : 'none';
    return v;
  }
}
</script>
