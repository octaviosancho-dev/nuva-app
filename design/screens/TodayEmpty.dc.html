*,*::before,*::after{box-sizing:border-box;}
body{margin:0;background:var(--canvas);color:var(--text-primary);font-family:var(--font-text);-webkit-font-smoothing:antialiased;}
button{font-family:inherit;border:none;background:none;padding:0;cursor:pointer;color:inherit;}
a{color:var(--text-link);}
.nv-eyebrow{display:inline-flex;align-items:center;height:26px;padding:0 12px;border-radius:var(--radius-pill);font-family:var(--font-text);font-size:11px;font-weight:500;letter-spacing:0.9px;text-transform:uppercase;white-space:nowrap;}
.nv-eyebrow--on-night{background:rgba(253,248,241,0.14);color:var(--text-on-night);}
.nv-eyebrow--on-light{background:var(--surface-sunken);color:var(--text-secondary);}

.nv-btn{display:inline-flex;align-items:center;justify-content:center;gap:var(--space-2);width:100%;min-height:56px;padding:0 var(--space-6);border:none;border-radius:var(--radius-pill);font-family:var(--font-text);font-size:16px;font-weight:500;letter-spacing:-0.1px;cursor:pointer;text-decoration:none;transition:transform 160ms var(--e-standard),opacity 240ms var(--e-standard);}
.nv-btn:active{transform:scale(0.98);}
.nv-btn--primary{background:var(--ember);color:var(--on-ember);box-shadow:var(--shadow-ember);}
.nv-btn--secondary{background:var(--sand);color:var(--on-sand);}
.nv-btn--ghost{background:transparent;color:var(--text-link);box-shadow:none;}
.nv-btn--on-night{background:var(--text-on-night);color:var(--night);box-shadow:none;}
.nv-btn--disabled{background:var(--ember);color:var(--on-ember);opacity:var(--opacity-disabled);box-shadow:none;cursor:not-allowed;}
.nv-btn--compact{min-height:42px;font-size:14px;padding:0 var(--space-5);width:auto;}
.nv-card{background:var(--surface);border-radius:var(--radius-lg);box-shadow:var(--shadow-sm);padding:var(--space-5);}
.nv-card--flat{box-shadow:none;border:1px solid var(--line);}
.nv-option{display:flex;align-items:center;gap:var(--space-4);width:100%;min-height:72px;padding:var(--space-4) var(--space-5);border:2px solid transparent;border-radius:var(--radius-lg);background:var(--surface);box-shadow:var(--shadow-xs);text-align:left;cursor:pointer;transition:border-color 160ms,box-shadow 160ms,transform 160ms;}
.nv-option:active{transform:scale(0.99);}
.nv-option--selected{border-color:var(--text-primary);box-shadow:var(--shadow-md);}
.nv-option__icon{flex:0 0 auto;width:44px;height:44px;border-radius:var(--radius-pill);display:grid;place-items:center;}
.nv-option__body{flex:1 1 auto;min-width:0;}
.nv-option__title{display:block;font-size:15px;font-weight:500;line-height:20px;color:var(--text-primary);}
.nv-option__sub{display:block;font-size:13.5px;line-height:20px;color:var(--text-secondary);margin-top:2px;}
.nv-option__check{flex:0 0 auto;width:26px;height:26px;border-radius:var(--radius-pill);display:grid;place-items:center;}
.nv-option--selected .nv-option__check{background:var(--text-primary);}
.nv-option__check svg{opacity:0;transition:opacity 160ms;}
.nv-option--selected .nv-option__check svg{opacity:1;}
.nv-chip{display:inline-flex;align-items:center;gap:var(--space-2);min-height:46px;padding:var(--space-2) var(--space-4) var(--space-2) var(--space-2);border:1.5px solid var(--line-strong);border-radius:var(--radius-pill);background:var(--surface);color:var(--text-primary);font-family:var(--font-text);font-size:13px;font-weight:500;cursor:pointer;transition:background 160ms,border-color 160ms,transform 160ms,color 160ms;}
.nv-chip:active{transform:scale(0.97);}
.nv-chip__dot{width:30px;height:30px;border-radius:var(--radius-pill);display:grid;place-items:center;flex:0 0 auto;transition:background 160ms;}
.nv-chip--selected{border-color:transparent;box-shadow:var(--shadow-sm);}
.nv-sev{display:flex;gap:var(--space-2);}
.nv-sev__step{flex:1 1 0;display:flex;flex-direction:column;align-items:center;gap:var(--space-2);padding:var(--space-3) var(--space-1);border:1.5px solid transparent;border-radius:var(--radius-md);background:var(--surface-sunken);cursor:pointer;transition:border-color 160ms,background 160ms,opacity 160ms;}
.nv-sev__swatch{width:100%;height:26px;border-radius:var(--radius-xs);}
.nv-sev__label{font-size:12px;line-height:16px;color:var(--text-secondary);}
.nv-sev__step--selected{border-color:var(--text-primary);background:var(--surface);}
.nv-sev__step--selected .nv-sev__label{color:var(--text-primary);font-weight:500;}
.nv-link{color:var(--text-link);text-decoration:underline;text-underline-offset:2px;font-weight:500;cursor:pointer;}
.nv-link:active{opacity:var(--opacity-pressed);}
.nv-link--on-night{color:var(--ember);}
.nv-tabular{font-variant-numeric:tabular-nums;}

@keyframes nv-rise{from{opacity:0;transform:translateY(12px);}to{opacity:1;transform:none;}}

@keyframes nv-pop{0%{opacity:0;transform:scale(0.9);}100%{opacity:1;transform:scale(1);}}
@keyframes nv-breathe{0%,100%{transform:translateY(0) scaleY(1);}50%{transform:translateY(-1.5px) scaleY(1.015);}}

@keyframes nv-seg{from{transform:scaleX(0);}to{transform:scaleX(1);}}
@keyframes nv-pulse{0%,100%{transform:scaleX(1);}50%{transform:scaleX(1.06);}}
@keyframes nv-motes{0%{opacity:0.9;transform:translateY(0);}100%{opacity:0;transform:translateY(-6px);}}
@keyframes nv-spark{0%{opacity:0;transform:scale(0);}45%{opacity:1;transform:scale(1);}100%{opacity:0;transform:scale(0.4);}}
@keyframes nv-drawline{from{stroke-dashoffset:900;}to{stroke-dashoffset:0;}}

.a-rise20{animation:nv-rise20 560ms var(--e-enter) both;}
.a-fade{animation:nv-fade 380ms var(--e-enter) both;}

.a-pop{animation:nv-pop 160ms var(--e-standard) both;}
.a-breathe{animation:nv-breathe 3200ms var(--e-breathe) infinite;transform-origin:50% 100%;}
.d1{animation-delay:44ms;}.d2{animation-delay:88ms;}.d3{animation-delay:132ms;}.d4{animation-delay:176ms;}
.d5{animation-delay:220ms;}.d6{animation-delay:264ms;}.d7{animation-delay:308ms;}.d8{animation-delay:352ms;}

.a-breathe{animation:none;}
}
