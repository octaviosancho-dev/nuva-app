# Publishes the public site to GitHub Pages, served at https://nuvacare.app:
#   /privacy/             the privacy policy, from src/content/privacy.ts
#   /email/unsubscribed/  and /email/link-invalid/, for email-unsubscribe
#
# Built by scripts/build-site.mjs, so the web policy and the in-app policy can
# never drift apart.
#
# One-time setup (repo Settings → Pages): Source = "GitHub Actions".
name: Public site

on:
  push:
    branches: [main]
    paths:
      - src/content/privacy.ts
      - scripts/build-site.mjs
      - design/tokens.json
      - .github/workflows/pages.yml
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}privacy/
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      # No npm install: the script uses only Node built-ins.
      - run: node scripts/build-site.mjs
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
